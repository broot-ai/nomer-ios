name: Gosnomer
options:
  bundleIdPrefix: ru.gosnomer
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Gosnomer:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Gosnomer
        excludes:
          - "Settings.bundle"
          - "Info.plist"
          - "Web/bridge.js"
      - path: Gosnomer/Settings.bundle
        type: folder
        buildPhase: resources
      - path: Gosnomer/Web/bridge.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.gosnomer.app
        PRODUCT_NAME: Gosnomer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Gosnomer/Info.plist
        ENABLE_PREVIEWS: YES
    info:
      path: Gosnomer/Info.plist
      properties:
        CFBundleDisplayName: Госномер
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes:
          - tg
        NSCameraUsageDescription: Госномер использует камеру, чтобы вы могли сфотографировать машину или номер для объявления, чата и поддержки.
        NSPhotoLibraryUsageDescription: Госномер открывает галерею, чтобы вы могли прикрепить фото к объявлению, чату или обращению в поддержку.
        NSPhotoLibraryAddUsageDescription: Госномер сохраняет в галерею карточки номеров и машин, когда вы нажимаете «Сохранить».
        CFBundleURLTypes:
          - CFBundleURLName: ru.gosnomer.app
            CFBundleURLSchemes:
              - gosnomer
